<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ART OF CRAFT — AMÉLIE FAURENT</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #ffffff;
      --txt: #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      font-size: 11px;
      text-transform: lowercase;
      letter-spacing: 0.12em;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-link {
      text-decoration: none;
      color: var(--txt);
      transition: opacity 0.3s ease;
    }

    .nav-link:hover {
      opacity: 0.4;
    }

    .nav-link::before {
      content: "[ ";
    }

    .nav-link::after {
      content: " ]";
    }

    section {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 120px 40px 80px;
    }

    img {
      max-width: 85%;
      max-height: 80vh;
      object-fit: contain;
      display: block;
    }

    .hero {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }

    .label {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.45;
    }

    .index {
      min-height: 100vh;
      padding: 140px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .index h1 {
      font-size: 14px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 20px;
    }

    .index a {
      color: black;
      text-decoration: none;
      font-size: 18px;
      transition: opacity 0.3s ease;
    }

    .index a:hover {
      opacity: 0.4;
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 20px;
      }

      section {
        padding: 120px 20px 60px;
      }

      .label {
        left: 20px;
        bottom: 20px;
      }

      img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-left">
      <a href="#index" class="nav-link">index</a>
    </div>

    <div class="nav-right">
      <a href="#project-1" class="nav-link">the art of craft</a>
      <a href="mailto:amelie.faurent@example.com" class="nav-link">contact</a>
    </div>
  </nav>

  <!-- Index -->
  <section id="index" class="index">
    <h1>Index</h1>

    <a href="#project-1">01 — The Art of Craft</a>
    <a href="#project-2">02 — Editorial Series</a>
    <a href="#project-3">03 — Visual Identity</a>
  </section>

  <!-- Projet 1 -->
  <section id="project-1">
    <img
      src="images/project-1.jpg"
      alt="The Art of Craft"
    />

    <div class="label">
      THE ART OF CRAFT — 2026
    </div>
  </section>

  <!-- Projet 2 -->
  <section id="project-2">
    <img
      src="images/project-2.jpg"
      alt="Editorial Series"
    />

    <div class="label">
      EDITORIAL SERIES — 2026
    </div>
  </section>

  <!-- Projet 3 -->
  <section id="project-3">
    <img
      src="images/project-3.jpg"
      alt="Visual Identity"
    />

    <div class="label">
      VISUAL IDENTITY — 2026
    </div>
  </section>

</body>
</html>
